name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test, And Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CLIENT_ORIGIN: https://talentgraph-assessment.netlify.app
      COGNODB_URI: ${{ secrets.COGNODB_URI }}
      COGNODB_USERNAME: ${{ secrets.COGNODB_USERNAME }}
      COGNODB_PASSWORD: ${{ secrets.COGNODB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify CognoDB test secrets
        run: |
          node -e "const missing = ['COGNODB_URI','COGNODB_USERNAME','COGNODB_PASSWORD'].filter((name) => !process.env[name]); if (missing.length) { console.error('Missing GitHub Actions secrets: ' + missing.join(', ')); process.exit(1); }"

      - name: Lint workspaces
        run: npm run lint

      - name: Test frontend
        run: npm run test:client

      - name: Build frontend
        run: npm run build

      - name: Test backend API
        run: npm run test:server
